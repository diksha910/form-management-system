<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6">
        <div class="form-card">

            <h2 class="text-center mb-4">Feedback & Contact Form</h2>
            <p class="text-center text-muted mb-4">
                We'd love to hear your thoughts. Please fill out the form below.
            </p>

            <form action="/submit" method="POST" onsubmit="return validateForm()">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" id="name" class="form-control">
                    <small class="text-danger" id="nameError"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control">
                    <small class="text-danger" id="emailError"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" id="phone" class="form-control">
                    <small class="text-danger" id="phoneError"></small>
                </div>

                <div class="mb-4">
                    <label class="form-label">Message / Feedback</label>
                    <textarea name="message" id="message" class="form-control" rows="4"></textarea>
                    <small class="text-danger" id="messageError"></small>
                </div>

                <button class="btn btn-primary w-100">
                    Submit Feedback
                </button>

            </form>

        </div>
    </div>
</div>

<script src="/static/js/validation.js"></script>
</body>

</html>
